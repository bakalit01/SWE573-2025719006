# Render Blueprint: New → Blueprint → pick this repo. Creates the web app and a PostgreSQL database.
services:
  - type: web
    name: indigenous-crafts
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && python manage.py seed_reference_crafts --replace-samples && gunicorn config.wsgi --workers 2
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: SERVE_MEDIA  # demo: Django serves uploaded photos (they reset on redeploy)
        value: "True"
      - key: DATABASE_URL
        fromDatabase:
          name: indigenous-crafts-db
          property: connectionString
databases:
  - name: indigenous-crafts-db
    plan: free
    databaseName: crafts
    user: crafts
