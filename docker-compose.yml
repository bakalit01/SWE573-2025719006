# Local stack: docker compose up --build  →  http://localhost:8000
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: crafts
      POSTGRES_PASSWORD: crafts
      POSTGRES_DB: crafts
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crafts"]
      interval: 5s
      retries: 10
  web:
    build: .
    environment:
      DATABASE_URL: postgres://crafts:crafts@db:5432/crafts
      DJANGO_SECRET_KEY: local-docker-only
      DJANGO_SECURE_SSL_REDIRECT: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
volumes:
  pgdata:
