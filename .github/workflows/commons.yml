name: Commons photos
# Checks that every photo used by the real examples exists on Wikimedia Commons and is freely
# licensed. Runs on pull requests that change reference_data.py, and by hand.
# A commit message containing "[commons search: term; term]" also searches Commons for
# candidate photos and commits the results to docs/commons-search/ on that branch.
on:
  pull_request:
    paths: [crafts/reference_data.py, scripts/commons_lookup.py]
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/commons_lookup.py check

  search:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[commons search:')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Search Commons
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          terms=$(python3 -c "import os,re; m=re.search(r'\[commons search:([^\]]*)\]', os.environ['MESSAGE']); print('\n'.join(t.strip() for t in m.group(1).split(';') if t.strip()))")
          mapfile -t args <<< "$terms"
          python scripts/commons_lookup.py search docs/commons-search "${args[@]}"
      - name: Commit results to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/commons-search
          git commit -m "Commons search results" && git push || echo "No changes"
