name: Seed backlog issues
# Creates labels, milestones and issues from docs/USER_STORIES.md.
# Run from the Actions tab → "Seed backlog issues" → "Run workflow".
# Safe to re-run: existing labels/milestones are reused and existing issue titles are skipped.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only (don't create anything)"
        type: boolean
        default: false

permissions:
  issues: write
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create labels, milestones and issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/seed_github.py --repo "${{ github.repository }}" \
            ${{ inputs.dry_run && '--dry-run' || '' }}
