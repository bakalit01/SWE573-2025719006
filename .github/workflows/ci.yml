name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: crafts
          POSTGRES_PASSWORD: crafts
          POSTGRES_DB: crafts
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U crafts" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://crafts:crafts@localhost:5432/crafts
      DJANGO_SECRET_KEY: ci-only-not-secret
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --all-groups
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Skip until Django project exists (T-03)
        id: has_django
        run: test -f manage.py && echo "yes=1" >> "$GITHUB_OUTPUT" || echo "manage.py not yet present"
      - name: Migrations up to date
        if: steps.has_django.outputs.yes == '1'
        run: uv run python manage.py makemigrations --check --dry-run
      - name: Tests
        if: steps.has_django.outputs.yes == '1'
        run: uv run pytest --cov --cov-report=term-missing
      - name: Dependency audit
        run: uv run pip-audit || true
