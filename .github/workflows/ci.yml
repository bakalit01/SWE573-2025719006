name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: crafts
          POSTGRES_PASSWORD: crafts
          POSTGRES_DB: crafts
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U crafts" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://crafts:crafts@localhost:5432/crafts
      DJANGO_SECRET_KEY: ci-only-not-secret
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --all-groups --frozen
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Django checks
        run: |
          uv run python manage.py check
          uv run python manage.py makemigrations --check --dry-run
          DJANGO_SETTINGS_MODULE=config.settings.prod uv run python manage.py check --deploy --fail-level WARNING
      - name: requirements.txt matches uv.lock
        run: |
          uv export --no-dev --no-hashes --format requirements-txt -q -o /tmp/req.txt
          diff <(grep -v '^#' requirements.txt) <(grep -v '^#' /tmp/req.txt)
      - name: Install browser for end-to-end tests
        run: uv run playwright install --with-deps chromium
      - name: Tests (unit, integration, end-to-end)
        run: uv run pytest --cov --cov-report=term-missing --cov-fail-under=80
      - name: Dependency audit
        run: uv run pip-audit || true
