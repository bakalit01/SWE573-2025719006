[project]
name = "indigenous-crafts"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "django>=5.2,<5.3",
  "psycopg[binary]>=3.2",
  "django-environ>=0.11",
  "django-allauth>=65.0",
  "rules>=3.5",
  "django-filter>=24.3",
  "django-htmx>=1.21",
  "django-storages[s3]>=1.14",
  "pillow>=11.0",
  "argon2-cffi>=23.1",
  "gunicorn>=23.0",
  "whitenoise>=6.8",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-django>=4.9",
  "pytest-cov>=6.0",
  "factory-boy>=3.3",
  "pytest-playwright>=0.6",
  "axe-playwright-python>=0.1.4",
  "ruff>=0.8",
  "pre-commit>=4.0",
  "pip-audit>=2.7",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "--reuse-db"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ", "S"]
ignore = ["S101"]
