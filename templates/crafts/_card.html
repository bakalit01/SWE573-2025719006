<li class="card">
  <a class="card-link" href="{{ craft.get_absolute_url }}">
    {% with cover=craft.cover %}
      {% if cover %}
        <img class="card-img" src="{{ cover.url }}" alt="{{ cover.alt_text }}" loading="lazy" width="480" height="360">
      {% else %}
        <div class="card-img card-img-empty" aria-hidden="true"></div>
      {% endif %}
    {% endwith %}
    <div class="card-body">
      <p class="eyebrow">{{ craft.craft_type.name }}</p>
      <h3 class="card-title">{{ craft.title }}</h3>
      <p class="card-meta">{{ craft.community.name }}{% if craft.made_in %} · {{ craft.made_in }}{% endif %}</p>
    </div>
  </a>
</li>
